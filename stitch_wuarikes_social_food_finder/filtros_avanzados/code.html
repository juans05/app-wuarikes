<!-- Interactive micro-interactions script -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                if (!this.classList.contains('bg-primary') && !this.closest('footer') && !this.closest('header')) {
                    // Logic for chip toggling
                    const isSelected = this.classList.contains('bg-primary-container');
                    if (isSelected) {
                        this.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-2', 'border-primary');
                        this.classList.add('bg-surface-container', 'text-on-surface-variant');
                    } else {
                        this.classList.add('bg-primary-container', 'text-on-primary-container');
                        this.classList.remove('bg-surface-container', 'text-on-surface-variant');
                    }
                }
            });
        });

        const slider = document.querySelector('.custom-slider');
        const distanceVal = document.querySelector('span.text-primary.font-bold');
        slider.addEventListener('input', (e) => {
            distanceVal.textContent = `${e.target.value}.0 km`;
        });
    </script>

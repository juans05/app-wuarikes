                Publicar Check-in

</button>

<script>
        // Character Counter Logic
        const textarea = document.getElementById('review-comment');
        const charCount = document.getElementById('char-count');
        
        textarea.addEventListener('input', (e) => {
            const length = e.target.value.length;
            charCount.textContent = `${length} / 140`;
            if (length >= 130) {
                charCount.classList.add('text-error');
                charCount.classList.remove('text-outline');
            } else {
                charCount.classList.remove('text-error');
                charCount.classList.add('text-outline');
            }
        });

        // Star Rating Logic
        const stars = document.querySelectorAll('.star-btn');
        const ratingLabel = document.getElementById('rating-label');
        const labels = {
            '1': 'Podría mejorar 🤨',
            '2': 'Pasable 😐',
            '3': 'Bueno 🙂',
            '4': '¡Muy rico! 😋',
            '5': '¡Una joya! 🔥'
        };

        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                const val = star.getAttribute('data-value');
                ratingLabel.textContent = labels[val];
                
                stars.forEach((s, i) => {
                    const icon = s.querySelector('.material-symbols-outlined');
                    if (i <= index) {
                        icon.classList.add('star-active');
                        icon.classList.remove('text-surface-variant');
                        s.style.transform = `scale(${1 + (i*0.05)})`;
                    } else {
                        icon.classList.remove('star-active');
                        icon.classList.add('text-surface-variant');
                        s.style.transform = 'scale(1)';
                    }
                });
            });
        });
    </script>

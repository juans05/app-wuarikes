publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0
  geolocator: ^13.0.1
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http_parser: ^4.1.2
  flutter_facebook_auth: ^7.2.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
